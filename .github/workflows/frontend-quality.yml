name: Frontend quality (a11y + visual)

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend deps
        working-directory: backend
        run: uv sync --group dev

      - name: Frontend deps
        run: npm ci

      - name: Contrast gate
        run: npm run test:contrast

      - name: Token lint
        run: npm run lint:tokens

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed e2e data + session
        working-directory: backend
        env:
          DATA_DIR: ${{ github.workspace }}/frontend/e2e/.data
          E2E_ORIGIN: http://127.0.0.1:4173
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
          COOKIE_SECURE: 'false'
        run: uv run python ../frontend/e2e/seed_e2e.py

      - name: Playwright axe + visual
        env:
          CI: '1'
          DATA_DIR: ${{ github.workspace }}/frontend/e2e/.data
          E2E_ORIGIN: http://127.0.0.1:4173
          E2E_API_PORT: '8001'
          CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
          COOKIE_SECURE: 'false'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          retention-days: 7
